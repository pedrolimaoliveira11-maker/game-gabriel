<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Zombie City - Realistic Survival</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Arial', sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #gameContainer {
    position: relative;
    width: 960px;
    height: 640px;
    box-shadow: 0 0 80px rgba(255,20,20,0.5), 0 0 200px rgba(0,0,0,1);
    border: 2px solid #2a0000;
    border-radius: 8px;
    overflow: hidden;
    background: #0a0a0a;
  }
  canvas { display: block; cursor: none; }
  
  #hud {
    position: absolute;
    top: 14px; left: 14px;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 0 0 6px #000, 2px 2px 4px #000;
    pointer-events: none;
    z-index: 10;
    font-family: 'Courier New', monospace;
    letter-spacing: 1px;
  }
  #hud .linha { margin-bottom: 4px; }
  .barra {
    width: 180px; height: 14px;
    background: rgba(0,0,0,0.8);
    border: 2px solid #1a0000;
    border-radius: 3px;
    overflow: hidden;
    margin: 3px 0;
    position: relative;
    box-shadow: inset 0 0 12px rgba(0,0,0,1);
  }
  .barraVida {
    height: 100%; width: 100%;
    background: linear-gradient(180deg, #ff4444, #8a0000, #4a0000);
    transition: width 0.15s;
    box-shadow: 0 0 8px rgba(255,50,50,0.6);
  }
  .barraEscudo {
    height: 100%; width: 0%;
    background: linear-gradient(180deg, #6af, #148, #035);
    transition: width 0.15s;
    position: absolute; top: 0; left: 0;
    box-shadow: 0 0 8px rgba(100,180,255,0.7);
  }
  #hudGeral {
    position: absolute;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 14px;
    font-weight: bold;
    text-shadow: 0 0 6px #000;
    pointer-events: none;
    z-index: 10;
    font-family: 'Courier New', monospace;
    background: rgba(0,0,0,0.55);
    padding: 6px 16px;
    border-radius: 4px;
    border: 1px solid #2a0000;
    letter-spacing: 2px;
  }
  
  #btnPausarTop, #btnReiniciarTop {
    position: absolute;
    top: 14px;
    padding: 8px 16px;
    color: #fff;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    z-index: 12;
    font-family: 'Courier New', monospace;
    letter-spacing: 1px;
    transition: 0.15s;
  }
  #btnPausarTop {
    right: 140px;
    background: rgba(160,120,20,0.85);
    border: 2px solid #fd3;
  }
  #btnPausarTop:hover { background: #da0; box-shadow: 0 0 15px #fd3; }
  #btnReiniciarTop {
    right: 14px;
    background: rgba(160,20,20,0.85);
    border: 2px solid #f33;
  }
  #btnReiniciarTop:hover { background: #d00; box-shadow: 0 0 15px #f33; }
  
  #overlay, #pauseOverlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(30,0,0,0.95), rgba(0,0,0,0.99));
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #fff;
    z-index: 20;
    text-align: center;
    padding: 20px;
  }
  #pauseOverlay { z-index: 18; }
  #overlay h1, #pauseOverlay h1 {
    font-size: 52px;
    color: #e33;
    text-shadow: 0 0 40px #f00, 0 0 80px #f00, 4px 4px 8px #000;
    margin-bottom: 16px;
    letter-spacing: 8px;
    font-family: 'Courier New', monospace;
  }
  #pauseOverlay h1 { color: #fd3; text-shadow: 0 0 40px #fa0; }
  #overlay p, #pauseOverlay p {
    font-size: 14px;
    margin: 5px 0;
    color: #bbb;
    font-family: 'Courier New', monospace;
    letter-spacing: 1px;
  }
  .modos {
    display: flex;
    gap: 15px;
    margin-top: 25px;
  }
  #overlay button, #pauseOverlay button {
    padding: 15px 40px;
    font-size: 16px;
    background: linear-gradient(180deg, #c00, #600);
    color: #fff;
    border: 2px solid #f33;
    border-radius: 5px;
    cursor: pointer;
    font-weight: bold;
    letter-spacing: 3px;
    font-family: 'Courier New', monospace;
    transition: 0.2s;
    box-shadow: 0 0 20px rgba(255,0,0,0.4);
  }
  #overlay button:hover, #pauseOverlay button:hover { 
    background: linear-gradient(180deg, #f00, #800);
    box-shadow: 0 0 30px #f00;
    transform: scale(1.05);
  }
  .oculto { display: none !important; }
  
  #avisoNivel {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #ffd44d;
    font-size: 32px;
    font-weight: bold;
    text-shadow: 0 0 20px #f80, 0 0 40px #f80, 3px 3px 6px #000;
    z-index: 15;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    font-family: 'Courier New', monospace;
    letter-spacing: 3px;
  }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="game" width="960" height="640"></canvas>
  
  <div id="hud">
    <div class="linha" style="color:#6f6;">SOBREVIVENTE</div>
    <div class="linha">VIDA: <span id="vidaTxt">100</span></div>
    <div class="barra">
      <div class="barraVida" id="barraVida"></div>
      <div class="barraEscudo" id="barraEscudo"></div>
    </div>
    <div class="linha">ESCUDO: <span id="escudoValTxt">0</span></div>
    <div style="color:#ffd44d;">ARMA: <span id="armaTxt">Pistola</span></div>
    <div style="color:#fd3; margin-top:5px;">LANTERNA: <span id="lanternaTxt">ON</span></div>
  </div>
  
  <div id="hudGeral">
    💀 <span id="mortosTxt">0</span> | 🌊 ONDA <span id="ondaTxt">1</span>
  </div>
  
  <button id="btnPausarTop">⏸ PAUSAR (P)</button>
  <button id="btnReiniciarTop">⟳ REINICIAR (R)</button>
  <div id="avisoNivel"></div>
  
  <div id="pauseOverlay" class="oculto">
    <h1>PAUSADO</h1>
    <p>Pressione P ou ESC para continuar</p>
    <button id="btnContinuar">CONTINUAR</button>
  </div>
  
  <div id="overlay">
    <h1>ZOMBIE CITY</h1>
    <p>Sobreviva à noite apocalíptica</p>
    <p style="margin-top:15px; color:#6f6;">WASD / Setas = Mover</p>
    <p style="color:#6f6;">Mouse = Mirar | Clique = Atirar</p>
    <p style="color:#fd3;">F = Ligar/Desligar Lanterna</p>
    <p style="color:#fd3; margin-top:10px;">P / ESC = Pausar</p>
    <p style="color:#f66;">R = Reiniciar</p>
    <div class="modos">
      <button id="btnIniciar">JOGAR</button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';
  
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = 960;
  var H = 640;
  
  // HUD
  var elVida = document.getElementById('vidaTxt');
  var elBarraVida = document.getElementById('barraVida');
  var elBarraEscudo = document.getElementById('barraEscudo');
  var elEscudoVal = document.getElementById('escudoValTxt');
  var elArma = document.getElementById('armaTxt');
  var elLanterna = document.getElementById('lanternaTxt');
  var elMortos = document.getElementById('mortosTxt');
  var elOnda = document.getElementById('ondaTxt');
  var overlay = document.getElementById('overlay');
  var pauseOverlay = document.getElementById('pauseOverlay');
  var btnIniciar = document.getElementById('btnIniciar');
  var btnPausar = document.getElementById('btnPausarTop');
  var btnReiniciar = document.getElementById('btnReiniciarTop');
  var btnContinuar = document.getElementById('btnContinuar');
  var elAviso = document.getElementById('avisoNivel');
  
  // ===== MAPA =====
  var MAPA_W = 2800;
  var MAPA_H = 2100;
  
  // ===== ESTADO =====
  var rodando = false;
  var gameOver = false;
  var pausado = false;
  var ultimoTempo = 0;
  
  var player = null;
  var camX = 0, camY = 0;
  var zumbis = [];
  var tiros = [];
  var particulas = [];
  var bonus = [];
  var predios = [];
  var carros = [];
  var postes = [];
  var manchas = [];
  var mortos = 0;
  var onda = 1;
  var zumbisRestantes = 0;
  var zumbisSpawnados = 0;
  var tempoSpawn = 0;
  var avisoTimer = 0;
  var tempoJogo = 0;
  var tremorTela = 0;
  var flashDano = 0;
  var flashColeta = 0;
  var texturaChao = null;
  
  // ===== LANTERNA =====
  var lanternaAtiva = true;
  var lanternaRaio = 220;      // raio da luz
  var lanternaAngulo = Math.PI * 0.6; // abertura do cone (visual)
  
  // ===== MOUSE =====
  var mouseScreen = { x: 480, y: 320 };
  var mouseWorld = { x: 0, y: 0 };
  var mouseDown = false;
  
  // ===== TECLAS =====
  var teclas = {};
  
  // ===== ARMAS =====
  var ARMAS = [
    { nome: 'Pistola',       dano: 40,  cadencia: 120, velTiro: 15, raio: 3,   cor: '#ffd44d', multi: 1, spread: 0.03 },
    { nome: 'Pistola Dupla', dano: 45,  cadencia: 100, velTiro: 16, raio: 3,   cor: '#ffcc33', multi: 2, spread: 0.05 },
    { nome: 'SMG',           dano: 38,  cadencia: 65,  velTiro: 17, raio: 3,   cor: '#ffb347', multi: 2, spread: 0.08 },
    { nome: 'Rifle',         dano: 75,  cadencia: 80,  velTiro: 19, raio: 4,   cor: '#ff9a33', multi: 1, spread: 0.02 },
    { nome: 'Escopeta',      dano: 55,  cadencia: 150, velTiro: 16, raio: 3.5, cor: '#ff8844', multi: 5, spread: 0.28 },
    { nome: 'Rifle Assalto', dano: 85,  cadencia: 60,  velTiro: 21, raio: 4,   cor: '#ff7044', multi: 2, spread: 0.04 },
    { nome: 'Metralhadora',  dano: 70,  cadencia: 45,  velTiro: 22, raio: 3.5, cor: '#ff5533', multi: 3, spread: 0.12 },
    { nome: 'Lança-Chamas',  dano: 45,  cadencia: 35,  velTiro: 13, raio: 6,   cor: '#ff3322', multi: 2, spread: 0.3 },
    { nome: 'Plasma',        dano: 130, cadencia: 90,  velTiro: 24, raio: 6,   cor: '#aa55ff', multi: 3, spread: 0.1 },
    { nome: 'Suprema',       dano: 180, cadencia: 50,  velTiro: 26, raio: 7,   cor: '#ff00ff', multi: 4, spread: 0.14 }
  ];
  
  // ===== TEXTURA DE ASFALTO =====
  function gerarTexturaChao() {
    texturaChao = document.createElement('canvas');
    texturaChao.width = MAPA_W;
    texturaChao.height = MAPA_H;
    var tc = texturaChao.getContext('2d');
    
    tc.fillStyle = '#1a1a1a';
    tc.fillRect(0, 0, MAPA_W, MAPA_H);
    
    for (var i = 0; i < 25000; i++) {
      var x = Math.random() * MAPA_W;
      var y = Math.random() * MAPA_H;
      var g = Math.floor(15 + Math.random() * 45);
      tc.fillStyle = 'rgba(' + g + ',' + g + ',' + g + ',' + (0.2 + Math.random()*0.4) + ')';
      tc.fillRect(x, y, 1 + Math.random(), 1 + Math.random());
    }
    
    tc.strokeStyle = 'rgba(0,0,0,0.6)';
    tc.lineWidth = 1;
    for (var c = 0; c < 150; c++) {
      tc.beginPath();
      var cx = Math.random() * MAPA_W;
      var cy = Math.random() * MAPA_H;
      tc.moveTo(cx, cy);
      var segments = 3 + Math.floor(Math.random() * 5);
      for (var s = 0; s < segments; s++) {
        cx += (Math.random() - 0.5) * 80;
        cy += (Math.random() - 0.5) * 80;
        tc.lineTo(cx, cy);
      }
      tc.stroke();
    }
    
    tc.fillStyle = 'rgba(220,190,40,0.4)';
    for (var yy = 30; yy < MAPA_H; yy += 80) {
      for (var xx = 0; xx < MAPA_W; xx += 500) {
        tc.fillRect(xx + 250 - 20, yy, 40, 30);
      }
    }
    
    for (var m = 0; m < 80; m++) {
      var mx = Math.random() * MAPA_W;
      var my = Math.random() * MAPA_H;
      var mr = 20 + Math.random() * 50;
      var grad = tc.createRadialGradient(mx, my, 2, mx, my, mr);
      grad.addColorStop(0, 'rgba(0,0,0,0.5)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      tc.fillStyle = grad;
      tc.beginPath();
      tc.arc(mx, my, mr, 0, Math.PI * 2);
      tc.fill();
    }
  }
  
  // ===== GERAR CIDADE =====
  function gerarCidade() {
    predios = [];
    carros = [];
    postes = [];
    manchas = [];
    
    for (var i = 0; i < 140; i++) {
      var w = 70 + Math.random() * 90;
      var h = 70 + Math.random() * 110;
      var x = Math.random() * (MAPA_W - w);
      var y = Math.random() * (MAPA_H - h);
      
      if (Math.hypot(x + w/2 - MAPA_W/2, y + h/2 - MAPA_H/2) < 180) continue;
      
      var sobrepoe = false;
      for (var j = 0; j < predios.length; j++) {
        var p = predios[j];
        if (x < p.x + p.w + 25 && x + w + 25 > p.x &&
            y < p.y + p.h + 25 && y + h + 25 > p.y) {
          sobrepoe = true;
          break;
        }
      }
      if (sobrepoe) continue;
      
      var janelas = [];
      var numJanelas = Math.floor(3 + Math.random() * 6);
      for (var w2 = 0; w2 < numJanelas; w2++) {
        janelas.push({
          x: 0.1 + Math.random() * 0.8,
          y: 0.1 + Math.random() * 0.8,
          acesa: Math.random() < 0.25
        });
      }
      
      predios.push({
        x: x, y: y, w: w, h: h,
        cor: 'hsl(' + (200 + Math.random() * 40) + ', 6%, ' + (10 + Math.random() * 8) + '%)',
        janelas: janelas
      });
    }
    
    for (var k = 0; k < 25; k++) {
      var cx = 100 + Math.random() * (MAPA_W - 200);
      var cy = 100 + Math.random() * (MAPA_H - 200);
      if (Math.hypot(cx - MAPA_W/2, cy - MAPA_H/2) < 160) continue;
      carros.push({
        x: cx, y: cy, w: 55, h: 26,
        rot: Math.random() * Math.PI,
        cor: ['#5a1a1a', '#2a3a4a', '#4a4a2a', '#3a2a4a', '#2a4a3a'][Math.floor(Math.random()*5)]
      });
    }
    
    for (var po = 0; po < 70; po++) {
      postes.push({
        x: 60 + Math.random() * (MAPA_W - 120),
        y: 60 + Math.random() * (MAPA_H - 120)
      });
    }
  }
  
  // ===== CRIAR PLAYER =====
  function criarPlayer() {
    return {
      x: MAPA_W / 2,
      y: MAPA_H / 2,
      raio: 16,
      vel: 3.6,
      vida: 100,
      vidaMax: 100,
      escudo: 0,
      escudoMax: 100,
      angulo: 0,
      invulneravel: 0,
      passoAnim: 0,
      respira: 0,
      nivelArma: 0,
      mortos: 0,
      ultimoTiro: 0,
      flash: 0
    };
  }
  
  // ===== SPAWN ZUMBI =====
  function spawnZumbi() {
    var lado = Math.floor(Math.random() * 4);
    var x, y;
    var m = 100;
    if (lado === 0) { x = camX + Math.random() * W; y = camY - m; }
    else if (lado === 1) { x = camX + W + m; y = camY + Math.random() * H; }
    else if (lado === 2) { x = camX + Math.random() * W; y = camY + H + m; }
    else { x = camX - m; y = camY + Math.random() * H; }
    x = Math.max(30, Math.min(MAPA_W - 30, x));
    y = Math.max(30, Math.min(MAPA_H - 30, y));
    
    var mult = 1 + Math.floor(mortos / 30) * 0.35;
    var rapido = Math.random() < 0.15;
    
    var tonsPele = ['#4a5a3a', '#3a4a2a', '#5a6a4a', '#4a4a3a', '#5a4a3a', '#3a3a2a'];
    var tonsRoupa = ['#3a2a1a', '#2a2a3a', '#3a3a2a', '#4a2a2a', '#2a3a2a', '#2a2a2a'];
    
    zumbis.push({
      x: x, y: y,
      raio: rapido ? 12 : 15,
      vel: (rapido ? 1.8 : 1.2) * Math.min(2, mult * 0.8),
      vida: (rapido ? 30 : 50) * mult,
      vidaMax: (rapido ? 30 : 50) * mult,
      dano: (rapido ? 8 : 12) * mult,
      tipo: rapido ? 'rapido' : 'normal',
      angulo: 0,
      passo: Math.random() * Math.PI * 2,
      wobble: Math.random() * Math.PI * 2,
      cor: tonsPele[Math.floor(Math.random() * tonsPele.length)],
      roupa: tonsRoupa[Math.floor(Math.random() * tonsRoupa.length)],
      sangue: Math.random() < 0.3 ? '#600' : '#a00',
      cabelo: Math.random() < 0.5,
      mancando: Math.random() < 0.3,
      ferida: Math.random() < 0.6
    });
    zumbisSpawnados++;
  }
  
  function iniciarOnda() {
    zumbisRestantes = 5 + onda * 2;
    zumbisSpawnados = 0;
    tempoSpawn = 0;
  }
  
  // ===== ATIRAR =====
  function atirar() {
    if (!player || player.vida <= 0) return;
    
    var agora = performance.now();
    var arma = ARMAS[Math.min(player.nivelArma, ARMAS.length - 1)];
    
    if (agora - player.ultimoTiro < arma.cadencia) return;
    player.ultimoTiro = agora;
    player.flash = 8;
    
    var angulo = Math.atan2(mouseWorld.y - player.y, mouseWorld.x - player.x);
    
    for (var k = 0; k < arma.multi; k++) {
      var ang = angulo + (Math.random() - 0.5) * arma.spread * 2;
      tiros.push({
        x: player.x + Math.cos(ang) * (player.raio + 10),
        y: player.y + Math.sin(ang) * (player.raio + 10),
        vx: Math.cos(ang) * arma.velTiro,
        vy: Math.sin(ang) * arma.velTiro,
        raio: arma.raio,
        dano: arma.dano,
        cor: arma.cor,
        vida: 100,
        rastro: []
      });
    }
    
    for (var sp = 0; sp < 6; sp++) {
      var sa = angulo + (Math.random() - 0.5) * 0.6;
      var sv = 3 + Math.random() * 5;
      particulas.push({
        x: player.x + Math.cos(angulo) * (player.raio + 8),
        y: player.y + Math.sin(angulo) * (player.raio + 8),
        vx: Math.cos(sa) * sv,
        vy: Math.sin(sa) * sv,
        vida: 8 + Math.random() * 6,
        vidaMax: 14,
        cor: arma.cor,
        tamanho: 2 + Math.random() * 2
      });
    }
    
    tremorTela = Math.max(tremorTela, 2);
  }
  
  function criarSangue(x, y, cor, qtd) {
    for (var i = 0; i < qtd; i++) {
      var a = Math.random() * Math.PI * 2;
      var v = 1 + Math.random() * 6;
      particulas.push({
        x: x, y: y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v,
        vida: 20 + Math.random() * 20,
        vidaMax: 40,
        cor: cor,
        tamanho: 2 + Math.random() * 3
      });
    }
    if (manchas.length < 150 && Math.random() < 0.6) {
      manchas.push({
        x: x + (Math.random() - 0.5) * 15,
        y: y + (Math.random() - 0.5) * 15,
        raio: 5 + Math.random() * 12,
        alfa: 0.4 + Math.random() * 0.4,
        cor: cor
      });
    }
  }
  
  // ===== ATUALIZAR =====
  function atualizar(dt) {
    tempoJogo += dt;
    
    if (player) {
      player.respira += dt * 0.08;
      if (player.flash > 0) player.flash -= dt;
      
      if (player.vida > 0) {
        var dx = 0, dy = 0;
        if (teclas['w'] || teclas['arrowup']) dy -= 1;
        if (teclas['s'] || teclas['arrowdown']) dy += 1;
        if (teclas['a'] || teclas['arrowleft']) dx -= 1;
        if (teclas['d'] || teclas['arrowright']) dx += 1;
        
        if (dx !== 0 || dy !== 0) {
          var len = Math.sqrt(dx*dx + dy*dy);
          player.x += (dx / len) * player.vel * dt;
          player.y += (dy / len) * player.vel * dt;
          player.passoAnim += dt * 0.35;
        } else {
          player.passoAnim *= 0.9;
        }
        
        player.x = Math.max(player.raio, Math.min(MAPA_W - player.raio, player.x));
        player.y = Math.max(player.raio, Math.min(MAPA_H - player.raio, player.y));
        
        player.angulo = Math.atan2(mouseWorld.y - player.y, mouseWorld.x - player.x);
        
        if (player.invulneravel > 0) player.invulneravel -= dt;
      }
    }
    
    var alvoCamX = player.x - W / 2;
    var alvoCamY = player.y - H / 2;
    camX += (alvoCamX - camX) * 0.18;
    camY += (alvoCamY - camY) * 0.18;
    camX = Math.max(0, Math.min(MAPA_W - W, camX));
    camY = Math.max(0, Math.min(MAPA_H - H, camY));
    
    mouseWorld.x = mouseScreen.x + camX;
    mouseWorld.y = mouseScreen.y + camY;
    
    if (zumbisSpawnados < zumbisRestantes) {
      tempoSpawn += dt;
      if (tempoSpawn > 40) {
        tempoSpawn = 0;
        spawnZumbi();
      }
    } else if (zumbis.length === 0) {
      onda++;
      iniciarOnda();
      player.vida = Math.min(player.vidaMax, player.vida + 20);
      mostrarAviso('ONDA ' + onda);
    }
    
    for (var i = zumbis.length - 1; i >= 0; i--) {
      var z = zumbis[i];
      var ang = Math.atan2(player.y - z.y, player.x - z.x);
      z.angulo = ang;
      z.passo += dt * 0.3 * z.vel;
      z.wobble += dt * 0.15;
      
      var wobbleX = Math.cos(z.wobble) * 0.3;
      var wobbleY = Math.sin(z.wobble) * 0.3;
      
      z.x += (Math.cos(ang) * z.vel + wobbleX) * dt;
      z.y += (Math.sin(ang) * z.vel + wobbleY) * dt;
      
      var ddx = player.x - z.x;
      var ddy = player.y - z.y;
      var dist = Math.sqrt(ddx*ddx + ddy*ddy);
      
      if (dist < player.raio + z.raio && player.invulneravel <= 0 && player.vida > 0) {
        var dano = z.dano;
        if (player.escudo > 0) {
          var abs = Math.min(player.escudo, dano);
          player.escudo -= abs;
          dano -= abs;
        }
        if (dano > 0) player.vida -= dano;
        player.invulneravel = 25;
        criarSangue(player.x, player.y, player.escudo > 0 ? '#36f' : '#f33', 8);
        flashDano = 15;
        tremorTela = 6;
        
        if (player.vida <= 0) {
          player.vida = 0;
          finalizarJogo();
          return;
        }
      }
    }
    
    for (var t = tiros.length - 1; t >= 0; t--) {
      var tiro = tiros[t];
      tiro.x += tiro.vx * dt;
      tiro.y += tiro.vy * dt;
      tiro.vida -= dt;
      
      tiro.rastro.push({ x: tiro.x, y: tiro.y });
      if (tiro.rastro.length > 4) tiro.rastro.shift();
      
      if (tiro.x < -50 || tiro.x > MAPA_W + 50 || tiro.y < -50 || tiro.y > MAPA_H + 50 || tiro.vida <= 0) {
        tiros.splice(t, 1);
        continue;
      }
      
      var acertou = false;
      for (var zz = zumbis.length - 1; zz >= 0; zz--) {
        var zumbi = zumbis[zz];
        var d2x = tiro.x - zumbi.x;
        var d2y = tiro.y - zumbi.y;
        var rTotal = zumbi.raio + tiro.raio;
        
        if (d2x*d2x + d2y*d2y < rTotal*rTotal) {
          zumbi.vida -= tiro.dano;
          acertou = true;
          criarSangue(zumbi.x, zumbi.y, zumbi.sangue, 5);
          
          if (zumbi.vida <= 0) {
            criarSangue(zumbi.x, zumbi.y, '#800', 15);
            zumbis.splice(zz, 1);
            mortos++;
            player.mortos++;
            
            if (Math.random() < 0.25) {
              bonus.push({
                x: zumbi.x, y: zumbi.y,
                raio: 12,
                tipo: Math.random() < 0.6 ? 'vida' : 'escudo',
                vida: 400, vidaMax: 400,
                bob: Math.random() * Math.PI * 2
              });
            }
            
            if (player.mortos % 20 === 0 && player.nivelArma < ARMAS.length - 1) {
              player.nivelArma++;
              mostrarAviso('ARMA: ' + ARMAS[player.nivelArma].nome);
            }
          }
          break;
        }
      }
      
      if (acertou) tiros.splice(t, 1);
    }
    
    for (var b = bonus.length - 1; b >= 0; b--) {
      var bn = bonus[b];
      bn.vida -= dt;
      bn.bob += dt * 0.12;
      
      if (bn.vida <= 0) {
        bonus.splice(b, 1);
        continue;
      }
      
      var bdx = player.x - bn.x;
      var bdy = player.y - bn.y;
      if (bdx*bdx + bdy*bdy < (player.raio + bn.raio) * (player.raio + bn.raio)) {
        if (bn.tipo === 'vida') {
          player.vida = Math.min(player.vidaMax, player.vida + 25);
        } else {
          player.escudo = Math.min(player.escudoMax, player.escudo + 30);
        }
        flashColeta = 12;
        bonus.splice(b, 1);
      }
    }
    
    for (var p = particulas.length - 1; p >= 0; p--) {
      var part = particulas[p];
      part.x += part.vx * dt;
      part.y += part.vy * dt;
      part.vx *= 0.93;
      part.vy *= 0.93;
      part.vida -= dt;
      if (part.vida <= 0) particulas.splice(p, 1);
    }
    
    if (avisoTimer > 0) {
      avisoTimer -= dt;
      if (avisoTimer <= 0) elAviso.style.opacity = '0';
    }
    if (tremorTela > 0) tremorTela = Math.max(0, tremorTela - dt * 0.3);
    if (flashDano > 0) flashDano -= dt;
    if (flashColeta > 0) flashColeta -= dt;
  }
  
  // ===== DESENHAR =====
  function desenhar() {
    // Fundo escuro (noite)
    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, W, H);
    
    var shakeX = 0, shakeY = 0;
    if (tremorTela > 0) {
      shakeX = (Math.random() - 0.5) * tremorTela;
      shakeY = (Math.random() - 0.5) * tremorTela;
    }
    
    ctx.save();
    ctx.translate(-camX + shakeX, -camY + shakeY);
    
    // Chão
    if (texturaChao) {
      ctx.drawImage(texturaChao, camX, camY, W, H, camX, camY, W, H);
    }
    
    // Manchas de sangue no chão
    for (var m = 0; m < manchas.length; m++) {
      var mac = manchas[m];
      if (mac.x + mac.raio < camX - 10 || mac.x - mac.raio > camX + W + 10 ||
          mac.y + mac.raio < camY - 10 || mac.y - mac.raio > camY + H + 10) continue;
      
      ctx.globalAlpha = mac.alfa;
      ctx.fillStyle = mac.cor;
      ctx.beginPath();
      ctx.arc(mac.x, mac.y, mac.raio, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    // Postes de luz
    for (var po = 0; po < postes.length; po++) {
      var poste = postes[po];
      if (poste.x + 150 < camX || poste.x - 150 > camX + W ||
          poste.y + 150 < camY || poste.y - 150 > camY + H) continue;
      
      var grad = ctx.createRadialGradient(poste.x, poste.y, 5, poste.x, poste.y, 140);
      grad.addColorStop(0, 'rgba(255,220,130,0.22)');
      grad.addColorStop(0.5, 'rgba(255,220,130,0.08)');
      grad.addColorStop(1, 'rgba(255,220,130,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(poste.x, poste.y, 140, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = '#0a0a0a';
      ctx.beginPath();
      ctx.arc(poste.x, poste.y, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(255,240,180,0.95)';
      ctx.beginPath();
      ctx.arc(poste.x, poste.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
    
    // Prédios
    for (var i = 0; i < predios.length; i++) {
      var p = predios[i];
      if (p.x + p.w < camX - 10 || p.x > camX + W + 10 ||
          p.y + p.h < camY - 10 || p.y > camY + H + 10) continue;
      
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(p.x + 8, p.y + 8, p.w, p.h);
      
      ctx.fillStyle = p.cor;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      
      var gradFachada = ctx.createLinearGradient(p.x, p.y, p.x, p.y + p.h);
      gradFachada.addColorStop(0, 'rgba(255,255,255,0.1)');
      gradFachada.addColorStop(0.5, 'rgba(0,0,0,0)');
      gradFachada.addColorStop(1, 'rgba(0,0,0,0.6)');
      ctx.fillStyle = gradFachada;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x, p.y, p.w, p.h);
      
      for (var j = 0; j < p.janelas.length; j++) {
        var jan = p.janelas[j];
        var jx = p.x + jan.x * p.w - 6;
        var jy = p.y + jan.y * p.h - 7;
        
        if (jan.acesa) {
          var jgrad = ctx.createRadialGradient(jx + 6, jy + 7, 0, jx + 6, jy + 7, 18);
          jgrad.addColorStop(0, 'rgba(255,220,90,0.95)');
          jgrad.addColorStop(1, 'rgba(255,150,30,0.2)');
          ctx.fillStyle = jgrad;
        } else {
          ctx.fillStyle = 'rgba(10,15,25,0.95)';
        }
        ctx.fillRect(jx, jy, 12, 14);
      }
    }
    
    // Carros
    for (var c = 0; c < carros.length; c++) {
      var car = carros[c];
      if (car.x + 80 < camX || car.x - 80 > camX + W ||
          car.y + 80 < camY || car.y - 80 > camY + H) continue;
      
      ctx.save();
      ctx.translate(car.x, car.y);
      ctx.rotate(car.rot);
      
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(-car.w/2 + 5, -car.h/2 + 5, car.w, car.h);
      
      ctx.fillStyle = car.cor;
      ctx.fillRect(-car.w/2, -car.h/2, car.w, car.h);
      
      var cgrad = ctx.createLinearGradient(0, -car.h/2, 0, car.h/2);
      cgrad.addColorStop(0, 'rgba(255,255,255,0.25)');
      cgrad.addColorStop(0.5, 'rgba(0,0,0,0.1)');
      cgrad.addColorStop(1, 'rgba(0,0,0,0.5)');
      ctx.fillStyle = cgrad;
      ctx.fillRect(-car.w/2, -car.h/2, car.w, car.h);
      
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(-car.w/4, -car.h/2 + 4, car.w/2, car.h - 8);
      
      ctx.fillStyle = 'rgba(10,20,35,0.9)';
      ctx.fillRect(-car.w/4, -car.h/2 + 3, car.w/6, car.h - 6);
      ctx.fillRect(car.w/8, -car.h/2 + 3, car.w/6, car.h - 6);
      
      ctx.fillStyle = 'rgba(200,200,200,0.3)';
      ctx.fillRect(-car.w/2, -car.h/2 + 1, car.w, 1);
      
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-car.w/2, -car.h/2, car.w, car.h);
      
      ctx.restore();
    }
    
    // Bônus
    for (var bn = 0; bn < bonus.length; bn++) {
      desenharBonus(bonus[bn]);
    }
    
    // Partículas
    for (var pa = 0; pa < particulas.length; pa++) {
      var part = particulas[pa];
      ctx.globalAlpha = part.vida / part.vidaMax;
      ctx.fillStyle = part.cor;
      ctx.beginPath();
      ctx.arc(part.x, part.y, part.tamanho, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    // Zumbis
    for (var z = 0; z < zumbis.length; z++) {
      desenharZumbi(zumbis[z]);
    }
    
    // Tiros
    for (var t = 0; t < tiros.length; t++) {
      var tiro = tiros[t];
      
      for (var r = 0; r < tiro.rastro.length; r++) {
        ctx.globalAlpha = (r + 1) / tiro.rastro.length * 0.5;
        ctx.fillStyle = tiro.cor;
        ctx.beginPath();
        ctx.arc(tiro.rastro[r].x, tiro.rastro[r].y, tiro.raio * (r + 1) / tiro.rastro.length, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      
      var tgrad = ctx.createRadialGradient(tiro.x, tiro.y, 0, tiro.x, tiro.y, tiro.raio * 3);
      tgrad.addColorStop(0, tiro.cor);
      tgrad.addColorStop(0.4, 'rgba(255,255,255,0.6)');
      tgrad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = tgrad;
      ctx.beginPath();
      ctx.arc(tiro.x, tiro.y, tiro.raio * 3, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(tiro.x, tiro.y, tiro.raio * 0.7, 0, Math.PI * 2);
      ctx.fill();
    }
    
    // Player
    if (player) desenharPlayer(player);
    
    ctx.restore();
    
    // ===== ILUMINAÇÃO / LANTERNA =====
    // Desenha uma "máscara" escura com um furo iluminado ao redor do jogador.
    desenharIluminacao();
    
    // Mira na tela (por cima da escuridão)
    if (rodando && !gameOver && !pausado) {
      var mx = mouseScreen.x;
      var my = mouseScreen.y;
      
      var miraGrad = ctx.createRadialGradient(mx, my, 0, mx, my, 20);
      miraGrad.addColorStop(0, 'rgba(255,60,60,0.3)');
      miraGrad.addColorStop(1, 'rgba(255,60,60,0)');
      ctx.fillStyle = miraGrad;
      ctx.beginPath();
      ctx.arc(mx, my, 20, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.strokeStyle = 'rgba(255,60,60,0.95)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(mx, my, 13, 0, Math.PI * 2);
      ctx.stroke();
      
      ctx.beginPath();
      ctx.moveTo(mx - 20, my);
      ctx.lineTo(mx - 8, my);
      ctx.moveTo(mx + 8, my);
      ctx.lineTo(mx + 20, my);
      ctx.moveTo(mx, my - 20);
      ctx.lineTo(mx, my - 8);
      ctx.moveTo(mx, my + 8);
      ctx.lineTo(mx, my + 20);
      ctx.stroke();
      
      ctx.fillStyle = '#ff3c3c';
      ctx.beginPath();
      ctx.arc(mx, my, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
    
    // Vinheta escura
    var vig = ctx.createRadialGradient(W/2, H/2, H * 0.35, W/2, H/2, H * 0.85);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.7)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
    
    // Vinheta vermelha (vida baixa)
    if (player && player.vida > 0 && player.vida / player.vidaMax < 0.35) {
      var pulso = 0.15 + 0.15 * Math.sin(tempoJogo * 0.15);
      var vigVerm = ctx.createRadialGradient(W/2, H/2, H * 0.3, W/2, H/2, H * 0.85);
      vigVerm.addColorStop(0, 'rgba(0,0,0,0)');
      vigVerm.addColorStop(1, 'rgba(180,0,0,' + pulso + ')');
      ctx.fillStyle = vigVerm;
      ctx.fillRect(0, 0, W, H);
    }
    
    // Flash de dano
    if (flashDano > 0) {
      ctx.fillStyle = 'rgba(255,0,0,' + (flashDano / 15 * 0.3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    
    // Flash de coleta
    if (flashColeta > 0) {
      ctx.fillStyle = 'rgba(60,255,60,' + (flashColeta / 12 * 0.2) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }
  
  // ===== ILUMINAÇÃO (LANTERNA) =====
  function desenharIluminacao() {
    if (!player) return;
    
    // Posição do player na tela
    var px = player.x - camX;
    var py = player.y - camY;
    
    if (lanternaAtiva) {
      // 1) Escurecer o mundo com uma máscara
      ctx.save();
      
      // Máscara escura (fora da luz)
      // Usamos um gradiente radial que é transparente no centro (player) e opaco nas bordas
      var luz = ctx.createRadialGradient(px, py, 60, px, py, lanternaRaio);
      luz.addColorStop(0, 'rgba(0,0,0,0)');          // centro iluminado
      luz.addColorStop(0.55, 'rgba(0,0,0,0.35)');   // meio escuro
      luz.addColorStop(0.85, 'rgba(0,0,0,0.88)');   // quase preto
      luz.addColorStop(1, 'rgba(0,0,0,0.96)');      // preto total nas bordas
      
      ctx.fillStyle = luz;
      ctx.fillRect(0, 0, W, H);
      
      // 2) Aura amarela suave no centro (luz da lanterna)
      var auraAmarela = ctx.createRadialGradient(px, py, 10, px, py, 100);
      auraAmarela.addColorStop(0, 'rgba(255,230,140,0.16)');
      auraAmarela.addColorStop(0.5, 'rgba(255,220,100,0.06)');
      auraAmarela.addColorStop(1, 'rgba(255,200,80,0)');
      ctx.fillStyle = auraAmarela;
      ctx.beginPath();
      ctx.arc(px, py, 100, 0, Math.PI * 2);
      ctx.fill();
      
      // 3) Cone de lanterna na direção do mouse (feixe)
      var anguloPlayer = player.angulo;
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(anguloPlayer);
      
      // Feixe cônico
      var comprimentoFeixe = 260;
      var aberturaFeixe = Math.PI / 4; // 45 graus
      
      var feixe = ctx.createRadialGradient(0, 0, 10, 0, 0, comprimentoFeixe);
      feixe.addColorStop(0, 'rgba(255,240,170,0.18)');
      feixe.addColorStop(0.5, 'rgba(255,230,140,0.10)');
      feixe.addColorStop(1, 'rgba(255,220,100,0)');
      
      ctx.fillStyle = feixe;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, comprimentoFeixe, -aberturaFeixe, aberturaFeixe);
      ctx.closePath();
      ctx.fill();
      
      ctx.restore();
      
      ctx.restore();
    } else {
      // Lanterna desligada = escuro total com leve visão ao redor do player
      var escuro = ctx.createRadialGradient(px, py, 20, px, py, 120);
      escuro.addColorStop(0, 'rgba(0,0,0,0.6)');
      escuro.addColorStop(0.5, 'rgba(0,0,0,0.9)');
      escuro.addColorStop(1, 'rgba(0,0,0,0.98)');
      ctx.fillStyle = escuro;
      ctx.fillRect(0, 0, W, H);
    }
  }
  
  // ===== PLAYER =====
  function desenharPlayer(p) {
    if (p.vida <= 0) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.globalAlpha = 0.5;
      ctx.fillStyle = '#400';
      ctx.beginPath();
      ctx.ellipse(0, 0, p.raio * 1.5, p.raio * 0.7, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      return;
    }
    
    ctx.save();
    ctx.translate(p.x, p.y);
    
    // Sombra
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath();
    ctx.ellipse(3, p.raio * 0.8, p.raio * 1.15, p.raio * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Aura escudo
    if (p.escudo > 0) {
      var alfa = 0.3 + 0.15 * Math.sin(tempoJogo * 0.15);
      var escGrad = ctx.createRadialGradient(0, 0, p.raio * 0.8, 0, 0, p.raio + 14);
      escGrad.addColorStop(0, 'rgba(80,160,255,0)');
      escGrad.addColorStop(0.6, 'rgba(80,160,255,' + (alfa * 0.5) + ')');
      escGrad.addColorStop(1, 'rgba(80,160,255,0)');
      ctx.fillStyle = escGrad;
      ctx.beginPath();
      ctx.arc(0, 0, p.raio + 14, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.strokeStyle = 'rgba(120,190,255,' + alfa + ')';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, p.raio + 8, 0, Math.PI * 2);
      ctx.stroke();
    }
    
    if (p.invulneravel > 0 && Math.floor(p.invulneravel / 4) % 2 === 0) {
      ctx.globalAlpha = 0.55;
    }
    
    var anda = Math.sin(p.passoAnim * 8) * 2.5;
    var respira = Math.sin(p.respira) * 0.5;
    
    // Pernas
    ctx.fillStyle = '#1a2a4a';
    ctx.fillRect(-7, 4 + anda, 5, p.raio - 2);
    ctx.fillRect(2, 4 - anda, 5, p.raio - 2);
    
    // Sapatos
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(-7, 4 + p.raio - 2 + anda, 5, 4);
    ctx.fillRect(2, 4 + p.raio - 2 - anda, 5, 4);
    
    // Braço esquerdo
    ctx.fillStyle = '#e8a880';
    ctx.fillRect(-11, -p.raio * 0.4 + respira, 4, p.raio * 0.9);
    
    // Torso
    var gCorpo = ctx.createLinearGradient(-8, -p.raio * 0.6, 8, p.raio * 0.5);
    gCorpo.addColorStop(0, '#4a8a54');
    gCorpo.addColorStop(1, '#2a5a34');
    ctx.fillStyle = gCorpo;
    ctx.fillRect(-8, -p.raio * 0.6 + respira, 16, p.raio * 1.0);
    ctx.strokeStyle = '#1a2a1a';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-8, -p.raio * 0.6 + respira, 16, p.raio * 1.0);
    
    // Colete
    ctx.fillStyle = '#4a3a1a';
    ctx.fillRect(-8, -p.raio * 0.3 + respira, 16, 4);
    ctx.fillStyle = '#2a1a0a';
    ctx.fillRect(-8, p.raio * 0.2 + respira, 16, 3);
    
    // Cabeça
    var gCabeca = ctx.createRadialGradient(-2, -p.raio * 0.85 - 2, 1, 0, -p.raio * 0.85, p.raio * 0.65);
    gCabeca.addColorStop(0, '#fcd0aa');
    gCabeca.addColorStop(1, '#d8a070');
    ctx.fillStyle = gCabeca;
    ctx.beginPath();
    ctx.arc(0, -p.raio * 0.85 + respira, p.raio * 0.62, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#8a5a3a';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    
    // Cabelo
    ctx.fillStyle = '#1a0f05';
    ctx.beginPath();
    ctx.arc(0, -p.raio * 0.85 + respira, p.raio * 0.62, Math.PI, Math.PI * 2);
    ctx.fill();
    
    // Olhos
    var olhoDX = Math.cos(p.angulo) * 1.8;
    var olhoDY = Math.sin(p.angulo) * 1.8;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-3 + olhoDX, -p.raio * 0.9 + respira + olhoDY, 2.5, 0, Math.PI * 2);
    ctx.arc(3 + olhoDX, -p.raio * 0.9 + respira + olhoDY, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a3a6a';
    ctx.beginPath();
    ctx.arc(-3 + olhoDX * 1.4, -p.raio * 0.9 + respira + olhoDY * 1.4, 1.3, 0, Math.PI * 2);
    ctx.arc(3 + olhoDX * 1.4, -p.raio * 0.9 + respira + olhoDY * 1.4, 1.3, 0, Math.PI * 2);
    ctx.fill();
    
    // Sobrancelhas
    ctx.strokeStyle = '#2a1a0a';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-6, -p.raio * 1.15 + respira);
    ctx.lineTo(-2, -p.raio * 1.1 + respira);
    ctx.moveTo(2, -p.raio * 1.1 + respira);
    ctx.lineTo(6, -p.raio * 1.15 + respira);
    ctx.stroke();
    
    // Braço direito + arma
    ctx.save();
    ctx.rotate(p.angulo);
    
    ctx.fillStyle = '#e8a880';
    ctx.fillRect(p.raio * 0.3, -2, p.raio * 0.75, 4);
    
    var arma = ARMAS[Math.min(p.nivelArma, ARMAS.length - 1)];
    
    if (p.flash > 0) {
      var flashGrad = ctx.createRadialGradient(p.raio * 0.9 + 18, 0, 0, p.raio * 0.9 + 18, 0, 15);
      flashGrad.addColorStop(0, 'rgba(255,255,200,0.95)');
      flashGrad.addColorStop(0.4, arma.cor);
      flashGrad.addColorStop(1, 'rgba(255,150,30,0)');
      ctx.fillStyle = flashGrad;
      ctx.beginPath();
      ctx.arc(p.raio * 0.9 + 18, 0, 15, 0, Math.PI * 2);
      ctx.fill();
    }
    
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(p.raio * 0.9, -3.5, 16, 7);
    ctx.fillStyle = '#444';
    ctx.fillRect(p.raio * 0.9, -2, 16, 2);
    
    ctx.fillStyle = arma.cor;
    ctx.fillRect(p.raio * 0.9 + 14, -3, 3, 6);
    
    ctx.restore();
    
    ctx.restore();
  }
  
  // ===== ZUMBI =====
  function desenharZumbi(z) {
    ctx.save();
    ctx.translate(z.x, z.y);
    
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath();
    ctx.ellipse(2, z.raio * 0.8, z.raio * 1.1, z.raio * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.save();
    ctx.rotate(z.angulo + Math.PI / 2);
    
    var anda = Math.sin(z.passo * 8) * 1.8 * (z.mancando ? 1.5 : 1);
    var cabecaOscila = Math.sin(z.passo * 0.7) * 1;
    
    ctx.fillStyle = z.cor;
    ctx.fillRect(-z.raio * 0.6, -z.raio * 0.3, z.raio * 0.35, z.raio * 1.4);
    ctx.fillRect(z.raio * 0.25, -z.raio * 0.3, z.raio * 0.35, z.raio * 1.4);
    
    ctx.fillStyle = '#5a6a4a';
    ctx.beginPath();
    ctx.arc(-z.raio * 0.42, -z.raio * 0.4, 3, 0, Math.PI * 2);
    ctx.arc(z.raio * 0.42, -z.raio * 0.4, 3, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#2a1a0a';
    ctx.fillRect(-6, z.raio * 0.2 + anda, 4, z.raio * 0.7);
    ctx.fillRect(2, z.raio * 0.2 - anda, 4, z.raio * 0.7);
    
    var gCorpo = ctx.createRadialGradient(-z.raio * 0.3, -z.raio * 0.3, 1, 0, 0, z.raio * 1.2);
    gCorpo.addColorStop(0, z.cor);
    gCorpo.addColorStop(1, '#0a0a0a');
    ctx.fillStyle = gCorpo;
    ctx.beginPath();
    ctx.arc(0, 0, z.raio, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    
    if (z.ferida) {
      ctx.fillStyle = 'rgba(120,10,10,0.8)';
      ctx.beginPath();
      ctx.arc(-z.raio * 0.3, z.raio * 0.2, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = 'rgba(180,20,20,0.5)';
      ctx.fillRect(-z.raio * 0.3 - 0.5, z.raio * 0.2, 1, 5);
    }
    
    ctx.fillStyle = '#0a0806';
    ctx.beginPath();
    ctx.arc(z.raio * 0.4, -z.raio * 0.1, 2.5, 0, Math.PI * 2);
    ctx.fill();
    
    var headY = -z.raio * 0.85 + cabecaOscila;
    var gCabeca = ctx.createRadialGradient(-2, headY - 2, 1, 0, headY, z.raio * 0.65);
    gCabeca.addColorStop(0, z.cor);
    gCabeca.addColorStop(1, '#0a0a0a');
    ctx.fillStyle = gCabeca;
    ctx.beginPath();
    ctx.arc(0, headY, z.raio * 0.62, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    
    if (z.cabelo) {
      ctx.fillStyle = '#1a0a05';
      ctx.beginPath();
      ctx.arc(0, headY, z.raio * 0.62, Math.PI, Math.PI * 2);
      ctx.fill();
    }
    
    var olhoGrad = ctx.createRadialGradient(-3, headY - 2, 0, -3, headY - 2, 5);
    olhoGrad.addColorStop(0, '#fff');
    olhoGrad.addColorStop(0.3, '#f00');
    olhoGrad.addColorStop(1, 'rgba(180,0,0,0)');
    ctx.fillStyle = olhoGrad;
    ctx.beginPath();
    ctx.arc(-3, headY - 2, 5, 0, Math.PI * 2);
    ctx.arc(4, headY - 1, 4, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#f00';
    ctx.beginPath();
    ctx.arc(-3, headY - 2, 2, 0, Math.PI * 2);
    ctx.arc(4, headY - 1, 1.8, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#1a0505';
    ctx.beginPath();
    ctx.ellipse(0, headY + z.raio * 0.4, 4.5, 2.8, 0, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.fillStyle = '#c8c0a0';
    ctx.fillRect(-3, headY + z.raio * 0.3, 1.5, 2);
    ctx.fillRect(-0.5, headY + z.raio * 0.32, 1.5, 2);
    ctx.fillRect(2, headY + z.raio * 0.35, 1.2, 2);
    
    ctx.fillStyle = 'rgba(150,10,10,0.85)';
    ctx.beginPath();
    ctx.moveTo(0, headY + z.raio * 0.42);
    ctx.lineTo(-1, headY + z.raio * 0.55);
    ctx.lineTo(1, headY + z.raio * 0.5);
    ctx.lineTo(1.5, headY + z.raio * 0.6);
    ctx.closePath();
    ctx.fill();
    
    ctx.restore();
    
    if (z.vida < z.vidaMax) {
      var w = z.raio * 2.2;
      var bx = z.x - w / 2;
      var by = z.y - z.raio - 14;
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillRect(bx, by, w, 4);
      var pct = z.vida / z.vidaMax;
      var corBarra = pct > 0.5 ? '#3f3' : pct > 0.25 ? '#fa0' : '#f22';
      ctx.fillStyle = corBarra;
      ctx.fillRect(bx, by, w * pct, 4);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1;
      ctx.strokeRect(bx, by, w, 4);
    }
    
    ctx.restore();
  }
  
  // ===== BÔNUS =====
  function desenharBonus(b) {
    var bob = Math.sin(b.bob) * 3;
    var pulso = 1 + Math.sin(b.bob * 2) * 0.08;
    var alfa = b.vida < 100 ? 0.4 : 1;
    
    ctx.save();
    ctx.globalAlpha = alfa;
    ctx.translate(b.x, b.y + bob);
    
    var corHalo = b.tipo === 'vida' ? 'rgba(60,255,60,' : 'rgba(60,140,255,';
    var halo = ctx.createRadialGradient(0, 0, 2, 0, 0, 30);
    halo.addColorStop(0, corHalo + '0.5)');
    halo.addColorStop(1, corHalo + '0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(0, 0, 30, 0, Math.PI * 2);
    ctx.fill();
    
    ctx.scale(pulso, pulso);
    
    if (b.tipo === 'vida') {
      ctx.fillStyle = '#2a6a2a';
      ctx.beginPath();
      ctx.arc(0, 0, b.raio, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#8f8';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.fillRect(-2.5, -8, 5, 16);
      ctx.fillRect(-8, -2.5, 16, 5);
    } else {
      ctx.fillStyle = '#2a3a6a';
      ctx.beginPath();
      ctx.arc(0, 0, b.raio, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#6af';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#9cf';
      ctx.beginPath();
      ctx.moveTo(0, -8);
      ctx.lineTo(8, -5);
      ctx.lineTo(8, 2);
      ctx.lineTo(0, 8);
      ctx.lineTo(-8, 2);
      ctx.lineTo(-8, -5);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    
    ctx.restore();
  }
  
  // ===== LOOP =====
  function loop(tempo) {
    if (!rodando) return;
    
    var delta = tempo - ultimoTempo;
    if (delta > 100) delta = 100;
    ultimoTempo = tempo;
    
    if (!pausado && !gameOver) {
      var dt = delta / 16.67;
      if (dt > 3) dt = 3;
      atualizar(dt);
    }
    
    desenhar();
    atualizarHUD();
    
    requestAnimationFrame(loop);
  }
  
  // ===== HUD =====
  function atualizarHUD() {
    if (!player) return;
    elVida.textContent = Math.ceil(player.vida);
    elBarraVida.style.width = (player.vida / player.vidaMax * 100) + '%';
    elBarraEscudo.style.width = (player.escudo / player.escudoMax * 100) + '%';
    elEscudoVal.textContent = Math.ceil(player.escudo);
    elArma.textContent = ARMAS[Math.min(player.nivelArma, ARMAS.length - 1)].nome;
    elLanterna.textContent = lanternaAtiva ? 'ON' : 'OFF';
    elLanterna.style.color = lanternaAtiva ? '#ffd44d' : '#666';
    elMortos.textContent = mortos;
    elOnda.textContent = onda;
  }
  
  function mostrarAviso(texto) {
    elAviso.textContent = texto;
    elAviso.style.opacity = '1';
    avisoTimer = 90;
  }
  
  // ===== CONTROLES =====
  window.addEventListener('keydown', function(e) {
    var k = e.key.toLowerCase();
    teclas[k] = true;
    if (k === 'arrowup' || k === 'arrowdown' || k === 'arrowleft' || k === 'arrowright' || k === ' ') {
      e.preventDefault();
    }
    if ((k === 'p' || k === 'escape') && rodando && !gameOver) {
      togglePausa();
    }
    if (k === 'r' && rodando) {
      iniciarJogo();
    }
    if (k === 'f' && rodando && !gameOver) {
      lanternaAtiva = !lanternaAtiva;
    }
  });
  
  window.addEventListener('keyup', function(e) {
    teclas[e.key.toLowerCase()] = false;
  });
  
  canvas.addEventListener('mousemove', function(e) {
    var rect = canvas.getBoundingClientRect();
    var scaleX = W / rect.width;
    var scaleY = H / rect.height;
    mouseScreen.x = (e.clientX - rect.left) * scaleX;
    mouseScreen.y = (e.clientY - rect.top) * scaleY;
  });
  
  canvas.addEventListener('mousedown', function(e) {
    if (e.button === 0 && rodando && !gameOver && !pausado) {
      mouseDown = true;
      atirar();
    }
  });
  
  canvas.addEventListener('mouseup', function() {
    mouseDown = false;
  });
  
  canvas.addEventListener('mouseleave', function() {
    mouseDown = false;
  });
  
  canvas.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });
  
  setInterval(function() {
    if (mouseDown && rodando && !gameOver && !pausado) {
      atirar();
    }
  }, 30);
  
  // ===== PAUSA =====
  function togglePausa() {
    if (!rodando || gameOver) return;
    pausado = !pausado;
    if (pausado) {
      pauseOverlay.classList.remove('oculto');
      mouseDown = false;
    } else {
      pauseOverlay.classList.add('oculto');
      ultimoTempo = performance.now();
    }
  }
  
  btnPausar.addEventListener('click', togglePausa);
  btnContinuar.addEventListener('click', togglePausa);
  
  // ===== INICIAR / FINALIZAR =====
  function iniciarJogo() {
    player = criarPlayer();
    zumbis = [];
    tiros = [];
    particulas = [];
    bonus = [];
    manchas = [];
    mortos = 0;
    onda = 1;
    gameOver = false;
    pausado = false;
    mouseDown = false;
    tempoJogo = 0;
    tremorTela = 0;
    flashDano = 0;
    flashColeta = 0;
    lanternaAtiva = true;
    
    camX = MAPA_W / 2 - W / 2;
    camY = MAPA_H / 2 - H / 2;
    
    gerarCidade();
    gerarTexturaChao();
    iniciarOnda();
    
    elAviso.style.opacity = '0';
    overlay.classList.add('oculto');
    pauseOverlay.classList.add('oculto');
    
    rodando = true;
    ultimoTempo = performance.now();
    requestAnimationFrame(loop);
  }
  
  function finalizarJogo() {
    gameOver = true;
    rodando = false;
    mouseDown = false;
    overlay.classList.remove('oculto');
    overlay.innerHTML = 
      '<h1>FIM DE JOGO</h1>' +
      '<p>💀 Mortos: ' + mortos + '</p>' +
      '<p>🌊 Ondas: ' + (onda - 1) + '</p>' +
      '<p>🔫 Arma final: ' + ARMAS[Math.min(player.nivelArma, ARMAS.length - 1)].nome + '</p>' +
      '<div class="modos">' +
        '<button id="btnReiniciarFinal">JOGAR NOVAMENTE</button>' +
      '</div>';
    document.getElementById('btnReiniciarFinal').addEventListener('click', iniciarJogo);
  }
  
  btnIniciar.addEventListener('click', iniciarJogo);
  btnReiniciar.addEventListener('click', function() {
    if (rodando || gameOver) iniciarJogo();
  });
  
  gerarCidade();
  gerarTexturaChao();
})();
</script>
</body>
