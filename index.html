<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Zombie City</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #050505;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Arial', sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #gameContainer {
    position: relative;
    width: 900px;
    height: 600px;
    box-shadow: 0 0 60px rgba(255,30,30,0.35);
    border: 2px solid #300;
    border-radius: 6px;
    overflow: hidden;
  }
  canvas { display: block; cursor: none; background: #111; }
  
  #hud {
    position: absolute;
    top: 12px; left: 12px;
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 0 0 4px #000, 1px 1px 3px #000;
    pointer-events: none;
    z-index: 10;
    font-family: 'Courier New', monospace;
  }
  #hud .linha { margin-bottom: 3px; }
  .barra {
    width: 160px; height: 13px;
    background: rgba(0,0,0,0.7);
    border: 2px solid #222;
    border-radius: 3px;
    overflow: hidden;
    margin: 2px 0;
    position: relative;
  }
  .barraVida {
    height: 100%; width: 100%;
    background: linear-gradient(180deg, #f44, #a00);
    transition: width 0.1s;
  }
  .barraEscudo {
    height: 100%; width: 0%;
    background: linear-gradient(180deg, #6af, #148);
    transition: width 0.1s;
    position: absolute; top: 0; left: 0;
  }
  #hudGeral {
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    text-shadow: 0 0 4px #000;
    pointer-events: none;
    z-index: 10;
    font-family: 'Courier New', monospace;
    background: rgba(0,0,0,0.5);
    padding: 4px 12px;
    border-radius: 4px;
    border: 1px solid #333;
  }
  
  #btnPausarTop, #btnReiniciarTop {
    position: absolute;
    top: 12px;
    padding: 7px 14px;
    color: #fff;
    border-radius: 5px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    z-index: 12;
    font-family: 'Courier New', monospace;
  }
  #btnPausarTop {
    right: 130px;
    background: rgba(160,120,20,0.85);
    border: 2px solid #fd3;
  }
  #btnPausarTop:hover { background: #da0; }
  #btnReiniciarTop {
    right: 12px;
    background: rgba(160,20,20,0.85);
    border: 2px solid #f33;
  }
  #btnReiniciarTop:hover { background: #d00; }
  
  #overlay, #pauseOverlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.9);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #fff;
    z-index: 20;
    text-align: center;
    padding: 20px;
  }
  #pauseOverlay { z-index: 18; }
  #overlay h1, #pauseOverlay h1 {
    font-size: 44px;
    color: #e33;
    text-shadow: 0 0 30px #f00;
    margin-bottom: 12px;
    letter-spacing: 5px;
    font-family: 'Courier New', monospace;
  }
  #pauseOverlay h1 { color: #fd3; text-shadow: 0 0 30px #fa0; }
  #overlay p, #pauseOverlay p {
    font-size: 13px;
    margin: 4px 0;
    color: #ccc;
    font-family: 'Courier New', monospace;
  }
  .modos {
    display: flex;
    gap: 15px;
    margin-top: 20px;
  }
  #overlay button, #pauseOverlay button {
    padding: 13px 28px;
    font-size: 15px;
    background: linear-gradient(180deg, #c00, #700);
    color: #fff;
    border: 2px solid #f33;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
    letter-spacing: 2px;
    font-family: 'Courier New', monospace;
  }
  #overlay button:hover, #pauseOverlay button:hover { background: #f00; }
  .oculto { display: none !important; }
  
  #avisoNivel {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    color: #ffd44d;
    font-size: 26px;
    font-weight: bold;
    text-shadow: 0 0 20px #f80;
    z-index: 15;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
    font-family: 'Courier New', monospace;
  }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="game" width="900" height="600"></canvas>
  
  <div id="hud">
    <div class="linha" style="color:#6f6;">JOGADOR</div>
    <div class="linha">VIDA: <span id="vidaTxt">100</span></div>
    <div class="barra">
      <div class="barraVida" id="barraVida"></div>
      <div class="barraEscudo" id="barraEscudo"></div>
    </div>
    <div class="linha">ESCUDO: <span id="escudoValTxt">0</span></div>
    <div style="color:#ffd44d;">ARMA: <span id="armaTxt">Pistola</span></div>
  </div>
  
  <div id="hudGeral">
    MORTOS: <span id="mortosTxt">0</span> | ONDA: <span id="ondaTxt">1</span>
  </div>
  
  <button id="btnPausarTop">PAUSAR (P)</button>
  <button id="btnReiniciarTop">REINICIAR (R)</button>
  <div id="avisoNivel"></div>
  
  <div id="pauseOverlay" class="oculto">
    <h1>PAUSADO</h1>
    <p>Pressione P ou ESC para continuar</p>
    <button id="btnContinuar">CONTINUAR</button>
  </div>
  
  <div id="overlay">
    <h1>ZOMBIE CITY</h1>
    <p>Mapa gigante • Sobreviva às hordas</p>
    <p style="margin-top:15px; color:#6f6;">WASD = Mover</p>
    <p style="color:#6f6;">Mouse = Mirar</p>
    <p style="color:#6f6;">Clique = Atirar</p>
    <p style="color:#fd3; margin-top:10px;">P ou ESC = Pausar</p>
    <p style="color:#f66;">R = Reiniciar</p>
    <div class="modos">
      <button id="btnIniciar">JOGAR</button>
    </div>
  </div>
</div>

<script>
(function() {
  'use strict';
  
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = 900;
  var H = 600;
  
  // HUD
  var elVida = document.getElementById('vidaTxt');
  var elBarraVida = document.getElementById('barraVida');
  var elBarraEscudo = document.getElementById('barraEscudo');
  var elEscudoVal = document.getElementById('escudoValTxt');
  var elArma = document.getElementById('armaTxt');
  var elMortos = document.getElementById('mortosTxt');
  var elOnda = document.getElementById('ondaTxt');
  var overlay = document.getElementById('overlay');
  var pauseOverlay = document.getElementById('pauseOverlay');
  var btnIniciar = document.getElementById('btnIniciar');
  var btnPausar = document.getElementById('btnPausarTop');
  var btnReiniciar = document.getElementById('btnReiniciarTop');
  var btnContinuar = document.getElementById('btnContinuar');
  var elAviso = document.getElementById('avisoNivel');
  
  // ===== MAPA =====
  var MAPA_W = 2400;
  var MAPA_H = 1800;
  
  // ===== ESTADO =====
  var rodando = false;
  var gameOver = false;
  var pausado = false;
  var ultimoTempo = 0;
  
  var player = null;
  var camX = 0, camY = 0;
  var zumbis = [];
  var tiros = [];
  var particulas = [];
  var bonus = [];
  var predios = [];
  var carros = [];
  var mortos = 0;
  var onda = 1;
  var zumbisRestantes = 0;
  var zumbisSpawnados = 0;
  var tempoSpawn = 0;
  var avisoTimer = 0;
  var texturaChao = null;
  
  // ===== MOUSE =====
  var mouseScreen = { x: 450, y: 300 };
  var mouseWorld = { x: 0, y: 0 };
  var mouseDown = false;
  
  // ===== TECLAS =====
  var teclas = {};
  
  // ===== ARMAS =====
  var ARMAS = [
    { nome: 'Pistola',       dano: 40,  cadencia: 120, velTiro: 14, raio: 3,   cor: '#ffd44d', multi: 1, spread: 0.03 },
    { nome: 'Pistola Dupla', dano: 45,  cadencia: 100, velTiro: 15, raio: 3,   cor: '#ffcc33', multi: 2, spread: 0.05 },
    { nome: 'SMG',           dano: 38,  cadencia: 65,  velTiro: 16, raio: 3,   cor: '#ffb347', multi: 2, spread: 0.08 },
    { nome: 'Rifle',         dano: 75,  cadencia: 80,  velTiro: 18, raio: 4,   cor: '#ff9a33', multi: 1, spread: 0.02 },
    { nome: 'Escopeta',      dano: 55,  cadencia: 150, velTiro: 15, raio: 3.5, cor: '#ff8844', multi: 5, spread: 0.28 },
    { nome: 'Rifle Assalto', dano: 85,  cadencia: 60,  velTiro: 20, raio: 4,   cor: '#ff7044', multi: 2, spread: 0.04 },
    { nome: 'Metralhadora',  dano: 70,  cadencia: 45,  velTiro: 21, raio: 3.5, cor: '#ff5533', multi: 3, spread: 0.12 },
    { nome: 'Lança-Chamas',  dano: 45,  cadencia: 35,  velTiro: 12, raio: 6,   cor: '#ff3322', multi: 2, spread: 0.3 },
    { nome: 'Plasma',        dano: 130, cadencia: 90,  velTiro: 22, raio: 6,   cor: '#aa55ff', multi: 3, spread: 0.1 },
    { nome: 'Suprema',       dano: 180, cadencia: 50,  velTiro: 24, raio: 7,   cor: '#ff00ff', multi: 4, spread: 0.14 }
  ];
  
  // ===== GERAR TEXTURA DO CHÃO =====
  function gerarTexturaChao() {
    texturaChao = document.createElement('canvas');
    texturaChao.width = MAPA_W;
    texturaChao.height = MAPA_H;
    var tc = texturaChao.getContext('2d');
    tc.fillStyle = '#1e1e1e';
    tc.fillRect(0, 0, MAPA_W, MAPA_H);
    for (var i = 0; i < 8000; i++) {
      var x = Math.random() * MAPA_W;
      var y = Math.random() * MAPA_H;
      var g = Math.floor(20 + Math.random() * 40);
      tc.fillStyle = 'rgba(' + g + ',' + g + ',' + g + ',0.4)';
      tc.fillRect(x, y, 2, 2);
    }
    tc.fillStyle = 'rgba(200,180,40,0.3)';
    for (var yy = 20; yy < MAPA_H; yy += 60) {
      for (var xx = 0; xx < MAPA_W; xx += 400) {
        tc.fillRect(xx + 196, yy, 8, 30);
      }
    }
  }
  
  // ===== GERAR CIDADE =====
  function gerarCidade() {
    predios = [];
    carros = [];
    for (var i = 0; i < 120; i++) {
      var w = 60 + Math.random() * 80;
      var h = 60 + Math.random() * 100;
      var x = Math.random() * (MAPA_W - w);
      var y = Math.random() * (MAPA_H - h);
      if (Math.hypot(x + w/2 - MAPA_W/2, y + h/2 - MAPA_H/2) < 150) continue;
      var sobrepoe = false;
      for (var j = 0; j < predios.length; j++) {
        var p = predios[j];
        if (x < p.x + p.w + 20 && x + w + 20 > p.x &&
            y < p.y + p.h + 20 && y + h + 20 > p.y) {
          sobrepoe = true;
          break;
        }
      }
      if (sobrepoe) continue;
      predios.push({
        x: x, y: y, w: w, h: h,
        cor: 'hsl(210, 8%, ' + (12 + Math.random() * 8) + '%)'
      });
    }
    for (var k = 0; k < 20; k++) {
      var cx = 80 + Math.random() * (MAPA_W - 160);
      var cy = 80 + Math.random() * (MAPA_H - 160);
      if (Math.hypot(cx - MAPA_W/2, cy - MAPA_H/2) < 150) continue;
      carros.push({
        x: cx, y: cy, w: 50, h: 24,
        rot: Math.random() * Math.PI,
        cor: ['#5a1a1a', '#2a3a4a', '#4a4a2a', '#3a2a4a'][Math.floor(Math.random()*4)]
      });
    }
  }
  
  // ===== CRIAR PLAYER =====
  function criarPlayer() {
    return {
      x: MAPA_W / 2,
      y: MAPA_H / 2,
      raio: 16,
      vel: 3.5,
      vida: 100,
      vidaMax: 100,
      escudo: 0,
      escudoMax: 100,
      angulo: 0,
      invulneravel: 0,
      passoAnim: 0,
      nivelArma: 0,
      mortos: 0,
      ultimoTiro: 0
    };
  }
  
  // ===== SPAWN ZUMBI =====
  function spawnZumbi() {
    var lado = Math.floor(Math.random() * 4);
    var x, y;
    var m = 80;
    if (lado === 0) { x = camX + Math.random() * W; y = camY - m; }
    else if (lado === 1) { x = camX + W + m; y = camY + Math.random() * H; }
    else if (lado === 2) { x = camX + Math.random() * W; y = camY + H + m; }
    else { x = camX - m; y = camY + Math.random() * H; }
    x = Math.max(30, Math.min(MAPA_W - 30, x));
    y = Math.max(30, Math.min(MAPA_H - 30, y));
    
    var mult = 1 + Math.floor(mortos / 30) * 0.35;
    var rapido = Math.random() < 0.15;
    
    zumbis.push({
      x: x, y: y,
      raio: rapido ? 12 : 15,
      vel: (rapido ? 1.8 : 1.2) * Math.min(2, mult * 0.8),
      vida: (rapido ? 30 : 50) * mult,
      vidaMax: (rapido ? 30 : 50) * mult,
      dano: (rapido ? 8 : 12) * mult,
      tipo: rapido ? 'rapido' : 'normal',
      angulo: 0,
      passo: Math.random() * Math.PI * 2,
      cor: rapido ? '#5a8a3a' : '#4a5a3a'
    });
    zumbisSpawnados++;
  }
  
  function iniciarOnda() {
    zumbisRestantes = 5 + onda * 2;
    zumbisSpawnados = 0;
    tempoSpawn = 0;
  }
  
  // ===== ATIRAR =====
  function atirar() {
    if (!player || player.vida <= 0) return;
    
    var agora = performance.now();
    var arma = ARMAS[Math.min(player.nivelArma, ARMAS.length - 1)];
    
    if (agora - player.ultimoTiro < arma.cadencia) return;
    player.ultimoTiro = agora;
    
    var angulo = Math.atan2(mouseWorld.y - player.y, mouseWorld.x - player.x);
    
    for (var k = 0; k < arma.multi; k++) {
      var ang = angulo + (Math.random() - 0.5) * arma.spread * 2;
      tiros.push({
        x: player.x + Math.cos(ang) * (player.raio + 8),
        y: player.y + Math.sin(ang) * (player.raio + 8),
        vx: Math.cos(ang) * arma.velTiro,
        vy: Math.sin(ang) * arma.velTiro,
        raio: arma.raio,
        dano: arma.dano,
        cor: arma.cor,
        vida: 100
      });
    }
  }
  
  // ===== ATUALIZAR =====
  function atualizar(dt) {
    // Movimento
    if (player.vida > 0) {
      var dx = 0, dy = 0;
      if (teclas['w'] || teclas['arrowup']) dy -= 1;
      if (teclas['s'] || teclas['arrowdown']) dy += 1;
      if (teclas['a'] || teclas['arrowleft']) dx -= 1;
      if (teclas['d'] || teclas['arrowright']) dx += 1;
      
      if (dx !== 0 || dy !== 0) {
        var len = Math.sqrt(dx*dx + dy*dy);
        player.x += (dx / len) * player.vel * dt;
        player.y += (dy / len) * player.vel * dt;
        player.passoAnim += dt * 0.3;
      } else {
        player.passoAnim *= 0.9;
      }
      
      player.x = Math.max(player.raio, Math.min(MAPA_W - player.raio, player.x));
      player.y = Math.max(player.raio, Math.min(MAPA_H - player.raio, player.y));
      
      // Mira
      player.angulo = Math.atan2(mouseWorld.y - player.y, mouseWorld.x - player.x);
      
      if (player.invulneravel > 0) player.invulneravel -= dt;
    }
    
    // Câmera
    var alvoCamX = player.x - W / 2;
    var alvoCamY = player.y - H / 2;
    camX += (alvoCamX - camX) * 0.2;
    camY += (alvoCamY - camY) * 0.2;
    camX = Math.max(0, Math.min(MAPA_W - W, camX));
    camY = Math.max(0, Math.min(MAPA_H - H, camY));
    
    // Mouse no mundo (atualizado com a câmera)
    mouseWorld.x = mouseScreen.x + camX;
    mouseWorld.y = mouseScreen.y + camY;
    
    // Spawn
    if (zumbisSpawnados < zumbisRestantes) {
      tempoSpawn += dt;
      if (tempoSpawn > 40) {
        tempoSpawn = 0;
        spawnZumbi();
      }
    } else if (zumbis.length === 0) {
      onda++;
      iniciarOnda();
      player.vida = Math.min(player.vidaMax, player.vida + 15);
      mostrarAviso('ONDA ' + onda);
    }
    
    // Zumbis
    for (var i = zumbis.length - 1; i >= 0; i--) {
      var z = zumbis[i];
      var ang = Math.atan2(player.y - z.y, player.x - z.x);
      z.angulo = ang;
      z.passo += dt * 0.3 * z.vel;
      
      z.x += Math.cos(ang) * z.vel * dt;
      z.y += Math.sin(ang) * z.vel * dt;
      
      var ddx = player.x - z.x;
      var ddy = player.y - z.y;
      var dist = Math.sqrt(ddx*ddx + ddy*ddy);
      
      if (dist < player.raio + z.raio && player.invulneravel <= 0 && player.vida > 0) {
        var dano = z.dano;
        if (player.escudo > 0) {
          var abs = Math.min(player.escudo, dano);
          player.escudo -= abs;
          dano -= abs;
        }
        if (dano > 0) player.vida -= dano;
        player.invulneravel = 30;
        
        if (player.vida <= 0) {
          player.vida = 0;
          finalizarJogo();
          return;
        }
      }
    }
    
    // Tiros
    for (var t = tiros.length - 1; t >= 0; t--) {
      var tiro = tiros[t];
      tiro.x += tiro.vx * dt;
      tiro.y += tiro.vy * dt;
      tiro.vida -= dt;
      
      if (tiro.x < -50 || tiro.x > MAPA_W + 50 || tiro.y < -50 || tiro.y > MAPA_H + 50 || tiro.vida <= 0) {
        tiros.splice(t, 1);
        continue;
      }
      
      var acertou = false;
      for (var zz = zumbis.length - 1; zz >= 0; zz--) {
        var zumbi = zumbis[zz];
        var d2x = tiro.x - zumbi.x;
        var d2y = tiro.y - zumbi.y;
        var rTotal = zumbi.raio + tiro.raio;
        
        if (d2x*d2x + d2y*d2y < rTotal*rTotal) {
          zumbi.vida -= tiro.dano;
          acertou = true;
          
          for (var pp = 0; pp < 4; pp++) {
            var pa = Math.random() * Math.PI * 2;
            var pv = 1 + Math.random() * 4;
            particulas.push({
              x: zumbi.x, y: zumbi.y,
              vx: Math.cos(pa) * pv,
              vy: Math.sin(pa) * pv,
              vida: 15, vidaMax: 15,
              cor: '#a00', tamanho: 2
            });
          }
          
          if (zumbi.vida <= 0) {
            zumbis.splice(zz, 1);
            mortos++;
            player.mortos++;
            
            if (Math.random() < 0.25) {
              bonus.push({
                x: zumbi.x, y: zumbi.y,
                raio: 12,
                tipo: Math.random() < 0.6 ? 'vida' : 'escudo',
                vida: 400, vidaMax: 400,
                bob: Math.random() * Math.PI * 2
              });
            }
            
            if (player.mortos % 20 === 0 && player.nivelArma < ARMAS.length - 1) {
              player.nivelArma++;
              mostrarAviso('ARMA: ' + ARMAS[player.nivelArma].nome);
            }
          }
          break;
        }
      }
      
      if (acertou) tiros.splice(t, 1);
    }
    
    // Bônus
    for (var b = bonus.length - 1; b >= 0; b--) {
      var bn = bonus[b];
      bn.vida -= dt;
      bn.bob += dt * 0.1;
      
      if (bn.vida <= 0) {
        bonus.splice(b, 1);
        continue;
      }
      
      var bdx = player.x - bn.x;
      var bdy = player.y - bn.y;
      if (bdx*bdx + bdy*bdy < (player.raio + bn.raio) * (player.raio + bn.raio)) {
        if (bn.tipo === 'vida') {
          player.vida = Math.min(player.vidaMax, player.vida + 25);
        } else {
          player.escudo = Math.min(player.escudoMax, player.escudo + 30);
        }
        bonus.splice(b, 1);
      }
    }
    
    // Partículas
    for (var p = particulas.length - 1; p >= 0; p--) {
      var part = particulas[p];
      part.x += part.vx * dt;
      part.y += part.vy * dt;
      part.vx *= 0.94;
      part.vy *= 0.94;
      part.vida -= dt;
      if (part.vida <= 0) particulas.splice(p, 1);
    }
    
    if (avisoTimer > 0) {
      avisoTimer -= dt;
      if (avisoTimer <= 0) elAviso.style.opacity = '0';
    }
  }
  
  // ===== DESENHAR =====
  function desenhar() {
    // Fundo
    ctx.fillStyle = '#1e1e1e';
    ctx.fillRect(0, 0, W, H);
    
    ctx.save();
    ctx.translate(-camX, -camY);
    
    // Chão
    if (texturaChao) {
      ctx.drawImage(texturaChao, camX, camY, W, H, camX, camY, W, H);
    }
    
    // Prédios
    for (var i = 0; i < predios.length; i++) {
      var p = predios[i];
      if (p.x + p.w < camX - 10 || p.x > camX + W + 10 || p.y + p.h < camY - 10 || p.y > camY + H + 10) continue;
      
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(p.x + 5, p.y + 5, p.w, p.h);
      ctx.fillStyle = p.cor;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.strokeRect(p.x, p.y, p.w, p.h);
    }
    
    // Carros
    for (var c = 0; c < carros.length; c++) {
      var car = carros[c];
      if (car.x + 60 < camX || car.x - 60 > camX + W || car.y + 60 < camY || car.y - 60 > camY + H) continue;
      
      ctx.save();
      ctx.translate(car.x, car.y);
      ctx.rotate(car.rot);
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(-car.w/2 + 3, -car.h/2 + 3, car.w, car.h);
      ctx.fillStyle = car.cor;
      ctx.fillRect(-car.w/2, -car.h/2, car.w, car.h);
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(-car.w/2, -car.h/2, car.w, car.h);
      ctx.restore();
    }
    
    // Bônus
    for (var bn = 0; bn < bonus.length; bn++) {
      desenharBonus(bonus[bn]);
    }
    
    // Partículas
    for (var pa = 0; pa < particulas.length; pa++) {
      var part = particulas[pa];
      ctx.globalAlpha = part.vida / part.vidaMax;
      ctx.fillStyle = part.cor;
      ctx.beginPath();
      ctx.arc(part.x, part.y, part.tamanho, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    
    // Zumbis
    for (var z = 0; z < zumbis.length; z++) {
      desenharZumbi(zumbis[z]);
    }
    
    // Tiros
    for (var t = 0; t < tiros.length; t++) {
      var tiro = tiros[t];
      ctx.fillStyle = tiro.cor;
      ctx.beginPath();
      ctx.arc(tiro.x, tiro.y, tiro.raio, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(tiro.x, tiro.y, tiro.raio * 0.5, 0, Math.PI * 2);
      ctx.fill();
    }
    
    // Player
    if (player) desenharPlayer(player);
    
    ctx.restore();
    
    // Mira
    if (rodando && !gameOver && !pausado) {
      ctx.strokeStyle = 'rgba(255,60,60,0.95)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(mouseScreen.x, mouseScreen.y, 12, 0, Math.PI * 2);
      ctx.stroke();
      
      ctx.beginPath();
      ctx.moveTo(mouseScreen.x - 18, mouseScreen.y);
      ctx.lineTo(mouseScreen.x - 8, mouseScreen.y);
      ctx.moveTo(mouseScreen.x + 8, mouseScreen.y);
      ctx.lineTo(mouseScreen.x + 18, mouseScreen.y);
      ctx.moveTo(mouseScreen.x, mouseScreen.y - 18);
      ctx.lineTo(mouseScreen.x, mouseScreen.y - 8);
      ctx.moveTo(mouseScreen.x, mouseScreen.y + 8);
      ctx.lineTo(mouseScreen.x, mouseScreen.y + 18);
      ctx.stroke();
      
      ctx.fillStyle = '#ff3c3c';
      ctx.beginPath();
      ctx.arc(mouseScreen.x, mouseScreen.y, 2, 0, Math.PI * 2);
      ctx.fill();
    }
    
    // Vinheta
    var vig = ctx.createRadialGradient(W/2, H/2, H * 0.4, W/2, H/2, H * 0.85);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);
  }
  
  // ===== PLAYER =====
  function desenharPlayer(p) {
    if (p.vida <= 0) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = '#500';
      ctx.beginPath();
      ctx.ellipse(0, 0, p.raio * 1.3, p.raio * 0.6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      return;
    }
    
    ctx.save();
    ctx.translate(p.x, p.y);
    
    // Sombra
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.ellipse(2, p.raio * 0.7, p.raio * 1, p.raio * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Aura escudo
    if (p.escudo > 0) {
      ctx.strokeStyle = 'rgba(80,160,255,0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, p.raio + 8, 0, Math.PI * 2);
      ctx.stroke();
    }
    
    // Piscar se invulnerável
    if (p.invulneravel > 0 && Math.floor(p.invulneravel / 4) % 2 === 0) {
      ctx.globalAlpha = 0.5;
    }
    
    // ===== PERSONAGEM DE CIMA (não rotaciona o corpo) =====
    // O corpo sempre fica "de frente" para o topo da tela.
    // Apenas a arma é rotacionada para apontar na direção do mouse.
    
    // Pernas (animação de caminhada)
    var anda = Math.sin(p.passoAnim * 8) * 2.5;
    ctx.fillStyle = '#1a2a4a';
    ctx.fillRect(-7, 4 + anda, 5, p.raio - 2);
    ctx.fillRect(2, 4 - anda, 5, p.raio - 2);
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(-7, 4 + p.raio - 2 + anda, 5, 4);
    ctx.fillRect(2, 4 + p.raio - 2 - anda, 5, 4);
    
    // Braço esquerdo
    ctx.fillStyle = '#f0b088';
    ctx.fillRect(-11, -p.raio * 0.4, 4, p.raio * 0.9);
    
    // Torso
    var gCorpo = ctx.createLinearGradient(-8, -p.raio * 0.6, 8, p.raio * 0.5);
    gCorpo.addColorStop(0, '#4a8a54');
    gCorpo.addColorStop(1, '#2a5a34');
    ctx.fillStyle = gCorpo;
    ctx.fillRect(-8, -p.raio * 0.6, 16, p.raio * 1.0);
    ctx.strokeStyle = '#1a2a1a';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(-8, -p.raio * 0.6, 16, p.raio * 1.0);
    
    // Colete
    ctx.fillStyle = '#4a3a1a';
    ctx.fillRect(-8, -p.raio * 0.3, 16, 4);
    
    // Cabeça
    ctx.fillStyle = '#f4c49a';
    ctx.beginPath();
    ctx.arc(0, -p.raio * 0.85, p.raio * 0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#8a5a3a';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    
    // Cabelo
    ctx.fillStyle = '#1a0f05';
    ctx.beginPath();
    ctx.arc(0, -p.raio * 0.85, p.raio * 0.6, Math.PI, Math.PI * 2);
    ctx.fill();
    
    // Olhos (olhando levemente para o mouse)
    var olhoDX = Math.cos(p.angulo) * 1.5;
    var olhoDY = Math.sin(p.angulo) * 1.5;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(-3 + olhoDX, -p.raio * 0.9 + olhoDY, 2.2, 0, Math.PI * 2);
    ctx.arc(3 + olhoDX, -p.raio * 0.9 + olhoDY, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a3a6a';
    ctx.beginPath();
    ctx.arc(-3 + olhoDX * 1.3, -p.raio * 0.9 + olhoDY * 1.3, 1.1, 0, Math.PI * 2);
    ctx.arc(3 + olhoDX * 1.3, -p.raio * 0.9 + olhoDY * 1.3, 1.1, 0, Math.PI * 2);
    ctx.fill();
    
    // ===== BRAÇO DIREITO + ARMA (rotacionam para o mouse) =====
    ctx.save();
    ctx.rotate(p.angulo);
    
    // Braço direito esticado
    ctx.fillStyle = '#f0b088';
    ctx.fillRect(p.raio * 0.3, -2, p.raio * 0.7, 4);
    
    // Arma
    var arma = ARMAS[Math.min(p.nivelArma, ARMAS.length - 1)];
    ctx.fillStyle = '#333';
    ctx.fillRect(p.raio * 0.9, -3, 16, 6);
    ctx.fillStyle = arma.cor;
    ctx.fillRect(p.raio * 0.9 + 14, -3, 3, 6);
    
    ctx.restore();
    
    ctx.restore();
  }
  
  // ===== ZUMBI =====
  function desenharZumbi(z) {
    ctx.save();
    ctx.translate(z.x, z.y);
    
    // Sombra
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    ctx.ellipse(2, z.raio * 0.7, z.raio * 1, z.raio * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Corpo em pé (visão de cima)
    // Braços esticados para frente (na direção do ângulo)
    ctx.save();
    ctx.rotate(z.angulo);
    
    // Braços esticados
    ctx.fillStyle = z.cor;
    ctx.fillRect(4, -z.raio * 0.55, z.raio * 1.2, z.raio * 0.35);
    ctx.fillRect(4, z.raio * 0.2, z.raio * 1.2, z.raio * 0.35);
    
    ctx.restore();
    
    // Pernas (animação)
    var anda = Math.sin(z.passo * 8) * 1.5;
    ctx.fillStyle = '#2a1a0a';
    ctx.fillRect(-6, 3 + anda, 4, z.raio - 1);
    ctx.fillRect(2, 3 - anda, 4, z.raio - 1);
    
    // Corpo
    ctx.fillStyle = z.cor;
    ctx.beginPath();
    ctx.arc(0, 0, z.raio, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#0a0a0a';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    
    // Cabeça
    ctx.fillStyle = z.cor;
    ctx.beginPath();
    ctx.arc(0, -z.raio * 0.65, z.raio * 0.55, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.stroke();
    
    // Olhos vermelhos (na direção do ângulo)
    var olhoDX = Math.cos(z.angulo) * 2;
    var olhoDY = Math.sin(z.angulo) * 2;
    ctx.fillStyle = '#f00';
    ctx.beginPath();
    ctx.arc(-3 + olhoDX, -z.raio * 0.7 + olhoDY, 2, 0, Math.PI * 2);
    ctx.arc(3 + olhoDX, -z.raio * 0.7 + olhoDY, 2, 0, Math.PI * 2);
    ctx.fill();
    
    // Boca
    ctx.fillStyle = '#1a0505';
    ctx.fillRect(-3 + olhoDX * 0.5, -z.raio * 0.45 + olhoDY * 0.5, 6, 2.5);
    
    // Barra de vida
    if (z.vida < z.vidaMax) {
      var w = z.raio * 2;
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(-w/2, -z.raio - 12, w, 3);
      var pct = z.vida / z.vidaMax;
      ctx.fillStyle = pct > 0.5 ? '#3f3' : pct > 0.25 ? '#fa0' : '#f22';
      ctx.fillRect(-w/2, -z.raio - 12, w * pct, 3);
    }
    
    ctx.restore();
  }
  
  // ===== BÔNUS =====
  function desenharBonus(b) {
    var bob = Math.sin(b.bob) * 3;
    var alfa = b.vida < 100 ? 0.4 : 1;
    
    ctx.save();
    ctx.globalAlpha = alfa;
    ctx.translate(b.x, b.y + bob);
    
    if (b.tipo === 'vida') {
      ctx.fillStyle = '#2a6a2a';
      ctx.beginPath();
      ctx.arc(0, 0, b.raio, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#8f8';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.fillRect(-2, -7, 4, 14);
      ctx.fillRect(-7, -2, 14, 4);
    } else {
      ctx.fillStyle = '#2a3a6a';
      ctx.beginPath();
      ctx.arc(0, 0, b.raio, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#6af';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = '#9cf';
      ctx.beginPath();
      ctx.moveTo(0, -7);
      ctx.lineTo(7, -4);
      ctx.lineTo(7, 2);
      ctx.lineTo(0, 7);
      ctx.lineTo(-7, 2);
      ctx.lineTo(-7, -4);
      ctx.closePath();
      ctx.fill();
    }
    
    ctx.restore();
  }
  
  // ===== LOOP =====
  function loop(tempo) {
    if (!rodando) return;
    
    var delta = tempo - ultimoTempo;
    if (delta > 100) delta = 100;
    ultimoTempo = tempo;
    
    if (!pausado && !gameOver) {
      var dt = delta / 16.67;
      if (dt > 3) dt = 3;
      atualizar(dt);
    }
    
    desenhar();
    atualizarHUD();
    
    requestAnimationFrame(loop);
  }
  
  // ===== HUD =====
  function atualizarHUD() {
    if (!player) return;
    elVida.textContent = Math.ceil(player.vida);
    elBarraVida.style.width = (player.vida / player.vidaMax * 100) + '%';
    elBarraEscudo.style.width = (player.escudo / player.escudoMax * 100) + '%';
    elEscudoVal.textContent = Math.ceil(player.escudo);
    elArma.textContent = ARMAS[Math.min(player.nivelArma, ARMAS.length - 1)].nome;
    elMortos.textContent = mortos;
    elOnda.textContent = onda;
  }
  
  function mostrarAviso(texto) {
    elAviso.textContent = texto;
    elAviso.style.opacity = '1';
    avisoTimer = 90;
  }
  
  // ===== CONTROLES =====
  window.addEventListener('keydown', function(e) {
    var k = e.key.toLowerCase();
    teclas[k] = true;
    if (k === 'arrowup' || k === 'arrowdown' || k === 'arrowleft' || k === 'arrowright' || k === ' ') {
      e.preventDefault();
    }
    if ((k === 'p' || k === 'escape') && rodando && !gameOver) {
      togglePausa();
    }
    if (k === 'r' && rodando) {
      iniciarJogo();
    }
  });
  
  window.addEventListener('keyup', function(e) {
    teclas[e.key.toLowerCase()] = false;
  });
  
  canvas.addEventListener('mousemove', function(e) {
    var rect = canvas.getBoundingClientRect();
    var scaleX = W / rect.width;
    var scaleY = H / rect.height;
    mouseScreen.x = (e.clientX - rect.left) * scaleX;
    mouseScreen.y = (e.clientY - rect.top) * scaleY;
  });
  
  canvas.addEventListener('mousedown', function(e) {
    if (e.button === 0 && rodando && !gameOver && !pausado) {
      mouseDown = true;
      atirar();
    }
  });
  
  canvas.addEventListener('mouseup', function() {
    mouseDown = false;
  });
  
  canvas.addEventListener('mouseleave', function() {
    mouseDown = false;
  });
  
  canvas.addEventListener('contextmenu', function(e) {
    e.preventDefault();
  });
  
  // Tiro automático enquanto segura o mouse
  setInterval(function() {
    if (mouseDown && rodando && !gameOver && !pausado) {
      atirar();
    }
  }, 30);
  
  // ===== PAUSA =====
  function togglePausa() {
    if (!rodando || gameOver) return;
    pausado = !pausado;
    if (pausado) {
      pauseOverlay.classList.remove('oculto');
      mouseDown = false;
    } else {
      pauseOverlay.classList.add('oculto');
      ultimoTempo = performance.now();
    }
  }
  
  btnPausar.addEventListener('click', togglePausa);
  btnContinuar.addEventListener('click', togglePausa);
  
  // ===== INICIAR / FINALIZAR =====
  function iniciarJogo() {
    player = criarPlayer();
    zumbis = [];
    tiros = [];
    particulas = [];
    bonus = [];
    mortos = 0;
    onda = 1;
    gameOver = false;
    pausado = false;
    mouseDown = false;
    
    camX = MAPA_W / 2 - W / 2;
    camY = MAPA_H / 2 - H / 2;
    
    gerarCidade();
    gerarTexturaChao();
    iniciarOnda();
    
    elAviso.style.opacity = '0';
    overlay.classList.add('oculto');
    pauseOverlay.classList.add('oculto');
    
    rodando = true;
    ultimoTempo = performance.now();
    requestAnimationFrame(loop);
  }
  
  function finalizarJogo() {
    gameOver = true;
    rodando = false;
    mouseDown = false;
    overlay.classList.remove('oculto');
    overlay.innerHTML = 
      '<h1>FIM DE JOGO</h1>' +
      '<p>Mortos: ' + mortos + '</p>' +
      '<p>Ondas: ' + (onda - 1) + '</p>' +
      '<p>Arma: ' + ARMAS[Math.min(player.nivelArma, ARMAS.length - 1)].nome + '</p>' +
      '<div class="modos">' +
        '<button id="btnReiniciarFinal">JOGAR NOVAMENTE</button>' +
      '</div>';
    document.getElementById('btnReiniciarFinal').addEventListener('click', iniciarJogo);
  }
  
  btnIniciar.addEventListener('click', iniciarJogo);
  btnReiniciar.addEventListener('click', function() {
    if (rodando || gameOver) iniciarJogo();
  });
  
  // Inicial
  gerarCidade();
  gerarTexturaChao();
})();
</script>
</body>
